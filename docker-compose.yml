# Local deps for aefi.
# Postgres required. Neo4j used from deliverable #3 (profile: graph).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aefi
      POSTGRES_PASSWORD: aefi
      POSTGRES_DB: aefi
    ports:
      - "5432:5432"
    volumes:
      - aefi_pg:/var/lib/postgresql/data
      - ./services/indexer/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aefi -d aefi"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/aefi-dev-password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - aefi_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  aefi_pg:
  aefi_neo4j:
