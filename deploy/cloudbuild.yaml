# Cloud Build — build & deploy aefi testnet stack (internal ingress)
# Manual:
#   gcloud builds submit --project=aefi-io --config=deploy/cloudbuild.yaml .
#
# Dual-network ready: change ARC_CHAIN_ID / service names for mainnet later.
# Phase 1 deploys testnet only (5042002).

substitutions:
  _REGION: us-central1
  _CHAIN_ID: "5042002"
  _VITE_AEFI_API_URL: https://api.aefi.io
  _SQL_INSTANCE: aefi-io:us-central1:aefi-postgres
  _VPC_CONNECTOR: aefi-connector

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/api:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/api:latest
      - .

  - id: build-matcher
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.matcher
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/matcher:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/matcher:latest
      - .

  - id: build-indexer
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.indexer
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/indexer:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/indexer:latest
      - .

  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.migrate
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/migrate:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/migrate:latest
      - .

  - id: build-www
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.www
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/www:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/www:latest
      - .

  - id: build-studio
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.studio
      - --build-arg
      - VITE_AEFI_API_URL=${_VITE_AEFI_API_URL}
      - --build-arg
      - VITE_ARC_CHAIN_ID=${_CHAIN_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/studio:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/studio:latest
      - .

  - id: build-rules
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.rules
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/api"]
    waitFor: [build-api]

  - id: push-matcher
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/matcher"]
    waitFor: [build-matcher]

  - id: push-indexer
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/indexer"]
    waitFor: [build-indexer]

  - id: push-migrate
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/migrate"]
    waitFor: [build-migrate]

  - id: push-www
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/www"]
    waitFor: [build-www]

  - id: push-studio
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/studio"]
    waitFor: [build-studio]

  - id: push-rules
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules"]
    waitFor: [build-rules]

  - id: update-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - aefi-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/migrate:$BUILD_ID
      - --region=${_REGION}
      - --memory=512Mi
      - --cpu=1
      - --task-timeout=300
      - --max-retries=1
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=AEFI-DATABASE-URL:latest
    waitFor: [push-migrate]

  - id: run-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - aefi-migrate
      - --region=${_REGION}
      - --wait
    waitFor: [update-migrate-job]

  - id: deploy-rules
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy aefi-rules \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --ingress=internal \
          --allow-unauthenticated \
          --port=8090 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=3 \
          --timeout=60
        gcloud run services add-iam-policy-binding aefi-rules \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet
    waitFor: [push-rules]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        RULES_URL="$(gcloud run services describe aefi-rules --region=${_REGION} --format='value(status.url)')"
        gcloud run deploy aefi-api \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/api:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --ingress=internal \
          --allow-unauthenticated \
          --port=8787 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --timeout=300 \
          --set-env-vars=NODE_ENV=production,ARC_CHAIN_ID=${_CHAIN_ID},AEFI_RULES_ENABLED=true,AEFI_RULES_URL=$${RULES_URL},AEFI_RULES_TIMEOUT_MS=8000,AEFI_X402_ENABLED=false,AEFI_RESOURCE_BASE_URL=https://api.aefi.io \
          --update-secrets=NEO4J_URI=AEFI-NEO4J-URI:latest,NEO4J_USER=AEFI-NEO4J-USER:latest,NEO4J_PASSWORD=AEFI-NEO4J-PASSWORD:latest,AEFI_API_KEY=AEFI-API-KEY:latest
        gcloud run services add-iam-policy-binding aefi-api \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet
    waitFor: [run-migrate, deploy-rules]

  - id: deploy-www
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy aefi-www \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/www:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --ingress=internal \
          --allow-unauthenticated \
          --port=8080 \
          --memory=256Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3
        gcloud run services add-iam-policy-binding aefi-www \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet
    waitFor: [push-www]

  - id: deploy-studio
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy aefi-studio \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/studio:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --ingress=internal \
          --allow-unauthenticated \
          --port=8080 \
          --memory=256Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3
        gcloud run services add-iam-policy-binding aefi-studio \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet
    waitFor: [push-studio]

  - id: deploy-indexer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aefi-indexer
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/indexer:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --ingress=internal
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=1
      - --timeout=3600
      - --no-cpu-throttling
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=ARC_CHAIN_ID=${_CHAIN_ID},ARC_RPC_URL=https://rpc.testnet.arc.io,INDEXER_ABI_DIR=/abi/5042002,INDEXER_POLL_MS=2000,INDEXER_BATCH_SIZE=40
      - --update-secrets=DATABASE_URL=AEFI-DATABASE-URL:latest
    waitFor: [run-migrate, push-indexer]

  - id: deploy-matcher
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aefi-matcher
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/matcher:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --ingress=internal
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=1
      - --timeout=3600
      - --no-cpu-throttling
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-env-vars=ARC_CHAIN_ID=${_CHAIN_ID},NODE_ENV=production,MATCHER_BATCH_SIZE=500,MATCHER_POLL_MS=250
      - --update-secrets=DATABASE_URL=AEFI-DATABASE-URL:latest,NEO4J_URI=AEFI-NEO4J-URI:latest,NEO4J_USER=AEFI-NEO4J-USER:latest,NEO4J_PASSWORD=AEFI-NEO4J-PASSWORD:latest
    waitFor: [run-migrate, push-matcher]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/api:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/matcher:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/indexer:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/migrate:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/www:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/studio:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:$BUILD_ID

timeout: 3600s
