# Build & deploy aefi-rules + enable on aefi-api (faster than full stack rebuild).
# gcloud builds submit --project=aefi-io --config=deploy/cloudbuild-rules.yaml .

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-rules
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.rules
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:latest
      - .

  - id: push-rules
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules"]
    waitFor: [build-rules]

  - id: deploy-rules
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy aefi-rules \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --ingress=internal \
          --allow-unauthenticated \
          --port=8090 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=3 \
          --timeout=60 \
          --set-env-vars=JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
        gcloud run services add-iam-policy-binding aefi-rules \
          --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet
        RULES_URL="$(gcloud run services describe aefi-rules --region=${_REGION} --format='value(status.url)')"
        echo "RULES_URL=$${RULES_URL}"
        gcloud run services update aefi-api \
          --region=${_REGION} \
          --update-env-vars="AEFI_RULES_ENABLED=true,AEFI_RULES_URL=$${RULES_URL},AEFI_RULES_TIMEOUT_MS=8000"
    waitFor: [push-rules]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/aefi/rules:$BUILD_ID

timeout: 1800s
